<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - WolfCore Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-glow" aria-hidden="true"></div>

  <div class="auth-container">
    <a href="index.html" class="auth-back">← Back to WolfCore Academy</a>

    <h1>🐺 WolfCore Portal</h1>
    <p class="welcome-text">Learn. Build. Succeed.</p>

    <div class="auth-tabs">
      <button id="loginTab" onclick="showLogin()">Login</button>
      <button id="signupTab" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <div id="loginForm" class="form-box">
      <h2>Login</h2>
      <input type="text" id="loginUsername" placeholder="Username">
      <div class="password-box">
        <input type="password" id="loginPass" placeholder="Password">
        <span onclick="togglePassword('loginPass')">👁️</span>
      </div>
      <button class="btn-gradient auth-submit" onclick="login()">Login</button>
      <p class="forgot-link" onclick="showForgot()">Forgot Password?</p>
    </div>

    <!-- SIGNUP -->
    <div id="signupForm" class="form-box hidden">
      <h2>Sign Up</h2>
      <input type="text" id="signupUsername" placeholder="Username">
      <!-- IMPORTANT: type=text (supports email OR phone) -->
      <input type="text" id="signupEmail" placeholder="Email OR Phone (+256...)">
      <div class="password-box">
        <input type="password" id="signupPass" placeholder="Password">
        <span onclick="togglePassword('signupPass')">👁️</span>
      </div>
      <button class="btn-gradient auth-submit" onclick="signup()">Create Account</button>
    </div>

    <div id="forgotForm" class="form-box hidden">
      <h2>Forgot Password</h2>
      <input type="text" id="resetContact" placeholder="Email or Phone or Username">
      <button class="btn-gradient auth-submit" onclick="sendResetCode()">Send Code 📩</button>
      <hr>
      <input type="text" id="resetCode" placeholder="Enter Code">
      <input type="password" id="newPassword" placeholder="New Password">
      <button class="btn-gradient auth-submit" onclick="resetPassword()">Reset Password 🔐</button>
      <p class="forgot-link" onclick="showLogin()">Back to Login</p>
    </div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
